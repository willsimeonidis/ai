<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>awa stinks</title>
  <style>
    :root {
      --bg-dark: #060812;
      --glass: rgba(15, 23, 42, 0.72);
      --border: rgba(168, 85, 247, 0.35);
      --text: #f8fafc;
      --neon-purple: #a855f7;
      --neon-cyan: #06b6d4;
      --neon-pink: #ec4899;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: linear-gradient(-45deg, #060812, #110b29, #09192f, #180924);
      background-size: 400% 400%;
      animation: bgGradientShift 14s ease infinite;
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    @keyframes bgGradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(95px);
      opacity: 0.45;
      z-index: 0;
      pointer-events: none;
      animation: floatOrb 12s infinite alternate ease-in-out;
    }
    .orb-1 { width: 400px; height: 400px; background: var(--neon-purple); top: -90px; left: -90px; }
    .orb-2 { width: 360px; height: 360px; background: var(--neon-cyan); bottom: -90px; right: -70px; animation-delay: -4s; }
    .orb-3 { width: 280px; height: 280px; background: var(--neon-pink); top: 42%; left: 48%; animation-delay: -8s; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(45px, -35px) scale(1.15); }
      100% { transform: translate(-35px, 45px) scale(0.92); }
    }

    .topbar {
      position: relative;
      z-index: 2;
      height: 62px;
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 6px 30px rgba(0, 0, 0, 0.45);
    }

    .bin-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .bin-btn:hover {
      background: #ef4444;
      border-color: #ef4444;
      transform: scale(1.14) rotate(-10deg);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.75);
    }
    .bin-btn:active { transform: scale(0.9); }

    .title-glow {
      font-weight: 900;
      font-size: 1.25rem;
      letter-spacing: 0.8px;
      background: linear-gradient(90deg, #06b6d4, #a855f7, #ec4899, #3b82f6, #06b6d4);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textShimmer 4s linear infinite;
      filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.4));
    }

    @keyframes textShimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    .chat-box {
      position: relative;
      z-index: 2;
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
      scroll-behavior: smooth;
    }

    .chat-box::-webkit-scrollbar { width: 6px; }
    .chat-box::-webkit-scrollbar-thumb {
      background: linear-gradient(var(--neon-cyan), var(--neon-purple));
      border-radius: 10px;
    }

    .msg {
      max-width: 82%;
      padding: 14px 18px;
      border-radius: 18px;
      line-height: 1.6;
      font-size: 0.96rem;
      word-wrap: break-word;
      animation: msgSpringIn 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.32);
    }

    @keyframes msgSpringIn {
      0% { opacity: 0; transform: translateY(18px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #4f46e5, #9333ea, #db2777);
      color: white;
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
      box-shadow: 0 6px 22px rgba(147, 51, 234, 0.4);
    }

    .msg.ai {
      align-self: flex-start;
      background: var(--glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg.ai h3 { margin: 12px 0 6px; color: #38bdf8; font-size: 1.06rem; }
    .msg.ai pre {
      background: rgba(5, 8, 17, 0.92);
      padding: 12px;
      border-radius: 10px;
      overflow-x: auto;
      margin: 10px 0;
      border: 1px solid rgba(6, 182, 212, 0.35);
    }
    .msg.ai code {
      font-family: monospace;
      font-size: 0.86rem;
      background: rgba(0, 0, 0, 0.45);
      padding: 2px 6px;
      border-radius: 5px;
      color: #67e8f9;
    }
    .msg.ai pre code { padding: 0; background: transparent; color: #e2e8f0; }

    .typing-dots {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 22px;
      padding: 0 4px;
    }
    .typing-dots span {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--neon-cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--neon-cyan);
      animation: bounceDot 1.2s infinite ease-in-out both;
    }
    .typing-dots span:nth-child(1) { animation-delay: -0.32s; background: #06b6d4; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; background: #a855f7; }
    .typing-dots span:nth-child(3) { animation-delay: 0s; background: #ec4899; }

    @keyframes bounceDot {
      0%, 80%, 100% { transform: scale(0.3); opacity: 0.5; }
      40% { transform: scale(1.1); opacity: 1; }
    }

    .input-wrapper {
      position: relative;
      z-index: 2;
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding: 14px 20px;
    }
    .input-area {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
    }
    .input-area textarea {
      flex: 1;
      resize: none;
      height: 52px;
      background: rgba(8, 12, 24, 0.88);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 13px 16px;
      border-radius: 14px;
      font-size: 0.96rem;
      outline: none;
      transition: all 0.25s ease;
    }
    .input-area textarea:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 18px rgba(6, 182, 212, 0.4);
    }

    .send-btn {
      background: linear-gradient(135deg, #06b6d4, #8b5cf6, #ec4899);
      background-size: 200% 200%;
      animation: btnGlowShift 4s ease infinite;
      color: white;
      border: none;
      padding: 0 26px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.96rem;
      cursor: pointer;
      height: 52px;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 0 16px rgba(139, 92, 246, 0.45);
    }
    @keyframes btnGlowShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .send-btn:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 0 26px rgba(6, 182, 212, 0.8);
    }
    .send-btn:active:not(:disabled) { transform: scale(0.94); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <div class="topbar">
    <button class="bin-btn" id="clearBtn" type="button" onclick="clearChat()" title="Clear Chat">🗑️</button>
    <div class="title-glow">awa stinks</div>
    <div style="width: 44px;"></div>
  </div>

  <div class="chat-box" id="chatBox">
    <div class="msg ai">Ready! Type anything below and hit <strong>Enter</strong>.</div>
  </div>

  <div class="input-wrapper">
    <form class="input-area" onsubmit="event.preventDefault(); sendMessage();">
      <textarea id="userInput" placeholder="Ask anything... (Enter to send, Shift+Enter for new line)" onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); sendMessage(); }"></textarea>
      <button class="send-btn" id="sendBtn" type="submit">Send ⚡</button>
    </form>
  </div>

  <script>
    const PART_1 = "gsk_vW8r3xgPc6w3HtlEgO0cWGdyb3";
    const PART_2 = "FYkcnKEgmgWn6wLW7bBx6Zuw7d";
    const API_KEY = PART_1 + PART_2;

    const SYSTEM_PROMPT = "You are a super fast, helpful, and detailed tutor. Give clear, thorough explanations with examples.";

    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    let conversationHistory = [];

    function formatText(text) {
      let html = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      const tick = String.fromCharCode(96);
      const tripleTick = tick + tick + tick;
      const codeBlockRegex = new RegExp(tripleTick + "(\\w*)\\n([\\s\\S]*?)" + tripleTick, "g");
      const inlineCodeRegex = new RegExp(tick + "([^" + tick + "]+)" + tick, "g");

      html = html.replace(codeBlockRegex, "<pre><code>$2</code></pre>");
      html = html.replace(inlineCodeRegex, "<code>$1</code>");
      html = html.replace(/^### (.*$)/gm, "<h3>$1</h3>");
      html = html.replace(/^## (.*$)/gm, "<h3>$1</h3>");
      html = html.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
html = html.replace(/\n/g, "
");
return html;
}
function clearChat() {
conversationHistory = [];
chatBox.innerHTML = 'Chat cleared! What is next?';
}
function appendMessage(role, htmlContent) {
const div = document.createElement("div");
div.className = "msg " + role;
div.innerHTML = htmlContent;
chatBox.appendChild(div);
chatBox.scrollTop = chatBox.scrollHeight;
return div;
}
async function sendMessage() {
const text = userInput.value.trim();
if (!text || sendBtn.disabled) return;
userInput.value = "";
sendBtn.disabled = true;
const userDiv = document.createElement("div");
userDiv.className = "msg user";
userDiv.textContent = text;
chatBox.appendChild(userDiv);
chatBox.scrollTop = chatBox.scrollHeight;
conversationHistory.push({ role: "user", content: text });
const aiMsgDiv = appendMessage("ai", '');
let fullResponse = "";
try {
const response = await fetch("groq.com", {
method: "POST",
headers: {
"Authorization": "Bearer " + API_KEY,
"Content-Type": "application/json"
},
body: JSON.stringify({
model: "llama-3.1-8b-instant",
messages: [
{ role: "system", content: SYSTEM_PROMPT },
...conversationHistory
],
temperature: 0.6,
max_tokens: 2048,
stream: true
})
});
if (!response.ok) {
const errData = await response.json().catch(function() { return {}; });
throw new Error((errData.error && errData.error.message) || ("HTTP Error " + response.status));
}
const reader = response.body.getReader();
const decoder = new TextDecoder("utf-8");
let buffer = "";
while (true) {
const { done, value } = await reader.read();
if (done) break;
buffer += decoder.decode(value, { stream: true });
const lines = buffer.split("\n");
buffer = lines.pop();
for (const line of lines) {
const trimmed = line.trim();
if (!trimmed.startsWith("data: ")) continue;
const dataStr = trimmed.slice(6);
if (dataStr === "[DONE]") break;
try {
const parsed = JSON.parse(dataStr);
const firstChoice = parsed.choices && parsed.choices.at(0);
const token = (firstChoice && firstChoice.delta && firstChoice.delta.content) || "";
if (token) {
fullResponse += token;
aiMsgDiv.innerHTML = formatText(fullResponse);
chatBox.scrollTop = chatBox.scrollHeight;
}
} catch (e) {}
}
}
if (!fullResponse) {
aiMsgDiv.innerHTML = "⚠️ Empty response received.";
} else {
conversationHistory.push({ role: "assistant", content: fullResponse });
}
} catch (err) {
aiMsgDiv.innerHTML = 'Error: ' + err.message + '';
} finally {
sendBtn.disabled = false;
userInput.focus();
}
}
