<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>awa stinks</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body {
      background: linear-gradient(-45deg, #060812, #150b30, #081e36, #1f0a2e);
      background-size: 400% 400%;
      animation: bgShift 12s ease infinite;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .topbar {
      height: 60px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(168, 85, 247, 0.4);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .bin-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: white;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.1rem;
      transition: transform 0.2s, background 0.2s;
    }
    .bin-btn:hover { background: #ef4444; transform: scale(1.1) rotate(-8deg); }
    .title-glow {
      font-weight: 900;
      font-size: 1.25rem;
      background: linear-gradient(90deg, #06b6d4, #a855f7, #ec4899, #06b6d4);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textShimmer 4s linear infinite;
    }
    @keyframes textShimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      max-width: 82%;
      padding: 14px 18px;
      border-radius: 16px;
      line-height: 1.55;
      font-size: 0.96rem;
      word-wrap: break-word;
      animation: popIn 0.3s ease forwards;
    }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #4f46e5, #9333ea, #db2777);
      white-space: pre-wrap;
    }
    .msg.ai {
      align-self: flex-start;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(168, 85, 247, 0.35);
    }
    .msg.ai pre {
      background: #050811;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .input-wrapper {
      background: rgba(15, 23, 42, 0.8);
      border-top: 1px solid rgba(168, 85, 247, 0.4);
      padding: 14px 20px;
    }
    .input-area {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }
    textarea {
      flex: 1;
      resize: none;
      height: 50px;
      background: #090d1a;
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: white;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.96rem;
      outline: none;
    }
    textarea:focus { border-color: #06b6d4; box-shadow: 0 0 14px rgba(6, 182, 212, 0.4); }
    .send-btn {
      background: linear-gradient(135deg, #06b6d4, #8b5cf6, #ec4899);
      color: white;
      border: none;
      padding: 0 24px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      height: 50px;
    }
    .send-btn:disabled { opacity: 0.5; }
  </style>
</head>
<body>

  <div class="topbar">
    <button class="bin-btn" type="button" onclick="clearChat()">🗑️</button>
    <div class="title-glow">awa stinks</div>
    <div style="width: 44px;"></div>
  </div>

  <div class="chat-box" id="chatBox">
    <div class="msg ai" id="bootMsg">Loading script...</div>
  </div>

  <div class="input-wrapper">
    <div class="input-area">
      <textarea id="userInput" placeholder="Type here and press Enter..."></textarea>
      <button class="send-btn" id="sendBtn" type="button" onclick="sendMessage()">Send ⚡</button>
    </div>
  </div>

  <script>
    // ONLY replace the text inside the quotes on PART_1 and PART_2. DO NOT touch line 3!
    const PART_1 = "gsk_vW8r3xgPc6w3HtlEgO0cWGdyb3";
    const PART_2 = "FYkcnKEgmgWn6wLW7bBx6Zuw7d";
    const API_KEY = PART_1 + PART_2;

    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const bootMsg = document.getElementById("bootMsg");

    // Immediately verify script loaded & check key format
    if (API_KEY.includes("PASTE_")) {
      bootMsg.innerHTML = "⚠️ <strong>Script works!</strong> Now paste your Groq key halves into <code>PART_1</code> and <code>PART_2</code> on GitHub.";
    } else {
      bootMsg.innerHTML = "✅ <strong>Ready!</strong> Type a message and press <strong>Enter</strong>.";
    }

    // Enter sends message, Shift+Enter makes a new line
    userInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    let conversationHistory = [];

    function clearChat() {
      conversationHistory = [];
      chatBox.innerHTML = '<div class="msg ai">Chat cleared!</div>';
    }

    function formatText(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
        .replace(/\n/g, "<br>");
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || sendBtn.disabled) return;

      userInput.value = "";
      sendBtn.disabled = true;

      const userDiv = document.createElement("div");
      userDiv.className = "msg user";
      userDiv.textContent = text;
      chatBox.appendChild(userDiv);

      const aiDiv = document.createElement("div");
      aiDiv.className = "msg ai";
      aiDiv.textContent = "Thinking...";
      chatBox.appendChild(aiDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      conversationHistory.push({ role: "user", content: text });

      try {
        const res = await fetch("https://groq.com", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + API_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.1-8b-instant",
            messages: [
              { role: "system", content: "You are a fast, helpful tutor. Give clear, detailed explanations." },
              ...conversationHistory
            ],
            max_tokens: 2048
          })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error((data.error && data.error.message) || ("HTTP " + res.status));
        }

        const firstChoice = data.choices && data.choices.at(0);
        const reply = firstChoice && firstChoice.message && firstChoice.message.content;

        if (!reply) {
          aiDiv.textContent = "⚠️ No text returned from Groq.";
        } else {
          aiDiv.innerHTML = formatText(reply);
          conversationHistory.push({ role: "assistant", content: reply });
        }
      } catch (err) {
        aiDiv.innerHTML = '<span style="color:#f87171;"><strong>Error:</strong> ' + err.message + '</span>';
      } finally {
        sendBtn.disabled = false;
        chatBox.scrollTop = chatBox.scrollHeight;
        userInput.focus();
      }
    }
  </script>
</body>
</html>
