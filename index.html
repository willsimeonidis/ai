<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study & Code Assistant</title>
  <!-- Markdown & Code Highlighting Libraries via Standard CDNs -->
  <script src="https://jsdelivr.net"></script>
  <link rel="stylesheet" href="https://cloudflare.com">
  <script src="https://cloudflare.com"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --user-msg: #2563eb;
      --ai-msg: #1e293b;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
    
    /* Sidebar */
    .sidebar { width: 280px; background: var(--panel); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .sidebar h2 { font-size: 1.1rem; color: var(--text); }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
    input, select, textarea {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 10px; border-radius: 6px; font-size: 0.85rem; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    button {
      background: var(--accent); color: white; border: none; padding: 10px;
      border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    button:hover { opacity: 0.9; }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    button.secondary:hover { color: var(--text); border-color: var(--text); }

    /* Main Chat Area */
    .main { flex: 1; display: flex; flex-direction: column; height: 100vh; }
    .chat-box { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
    .msg { max-width: 82%; padding: 14px 18px; border-radius: 12px; line-height: 1.6; font-size: 0.95rem; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--user-msg); color: white; border-bottom-right-radius: 2px; }
    .msg.ai { align-self: flex-start; background: var(--ai-msg); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
    
    /* Markdown Formatting inside AI messages */
    .msg.ai h1, .msg.ai h2, .msg.ai h3 { margin: 12px 0 6px; color: #93c5fd; }
    .msg.ai p { margin-bottom: 10px; }
    .msg.ai p:last-child { margin-bottom: 0; }
    .msg.ai ul, .msg.ai ol { margin-left: 20px; margin-bottom: 10px; }
    .msg.ai pre { background: #0d1117; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 10px 0; border: 1px solid var(--border); }
    .msg.ai code { font-family: "Fira Code", monospace; font-size: 0.85rem; }

    /* Input Bar */
    .input-area { padding: 16px 24px; background: var(--panel); border-top: 1px solid var(--border); display: flex; gap: 12px; }
    .input-area textarea { flex: 1; resize: none; height: 52px; font-size: 0.95rem; }
    .input-area button { width: 100px; height: 52px; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .msg { max-width: 95%; }
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>⚡ Fast AI Workspace</h2>
    
    <div class="control-group">
      <label for="apiKey">Groq API Key (Saved Locally)</label>
      <input type="password" id="apiKey" placeholder="gsk_..." />
      <small style="color: var(--muted); font-size: 0.72rem;">Get a free key at ://groq.com (at home if blocked at school). Stored only in your browser.</small>
    </div>

    <div class="control-group">
      <label for="modelSelect">AI Model</label>
      <select id="modelSelect">
        <option value="llama-3.3-70b-versatile">Llama 3.3 70B (Deep Explanations)</option>
        <option value="llama-3.1-8b-instant">Llama 3.1 8B (Ultra Instant)</option>
        <option value="mixtral-8x7b-32768">Mixtral 8x7B (Long Context)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="systemPrompt">Explanation Style</label>
      <textarea id="systemPrompt" rows="5">You are an expert tutor and software engineer. Provide thorough, step-by-step explanations with clear examples, formatting, and deep detail so the user fully understands every concept.</textarea>
    </div>

    <button class="secondary" onclick="clearChat()">Clear Conversation</button>
  </div>

  <div class="main">
    <div class="chat-box" id="chatBox">
      <div class="msg ai">
        <strong>Ready!</strong> Paste your free Groq API key in the left sidebar to start. Your key never gets uploaded to GitHub—it stays strictly inside your browser's local storage.
      </div>
    </div>

    <div class="input-area">
      <textarea id="userInput" placeholder="Ask a detailed question... (Press Enter to send, Shift+Enter for new line)"></textarea>
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const apiKeyInput = document.getElementById("apiKey");
    const modelSelect = document.getElementById("modelSelect");
    const systemPromptInput = document.getElementById("systemPrompt");
    const sendBtn = document.getElementById("sendBtn");

    // Load saved API key from browser local storage (never touches GitHub)
    apiKeyInput.value = localStorage.getItem("groq_api_key") || "";
    apiKeyInput.addEventListener("input", () => {
      localStorage.setItem("groq_api_key", apiKeyInput.value.trim());
    });

    let conversationHistory = [];

    // Configure Marked.js for clean formatting
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      }
    });

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function clearChat() {
      conversationHistory = [];
      chatBox.innerHTML = `<div class="msg ai">Conversation cleared. What would you like to explore next?</div>`;
    }

    function appendMessage(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      if (role === "ai") {
        div.innerHTML = marked.parse(text);
      } else {
        div.textContent = text;
      }
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      const apiKey = apiKeyInput.value.trim();

      if (!text) return;
      if (!apiKey) {
        alert("Please enter your Groq API key in the sidebar first!");
        return;
      }

      userInput.value = "";
      sendBtn.disabled = true;
      appendMessage("user", text);

      conversationHistory.push({ role: "user", content: text });
      const aiMsgDiv = appendMessage("ai", "Thinking...");
      let fullResponse = "";

      try {
        const response = await fetch("https://groq.com", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: modelSelect.value,
            messages: [
              { role: "system", content: systemPromptInput.value },
              ...conversationHistory
            ],
            temperature: 0.6,
            max_tokens: 4096,
            stream: true
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || `HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        aiMsgDiv.innerHTML = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split("\n").filter(line => line.trim().startsWith("data: "));

          for (const line of lines) {
            const dataStr = line.replace("data: ", "").trim();
            if (dataStr === "[DONE]") break;

            try {
              const parsed = JSON.parse(dataStr);
              const token = parsed.choices[0]?.delta?.content || "";
              fullResponse += token;
              aiMsgDiv.innerHTML = marked.parse(fullResponse);
              chatBox.scrollTop = chatBox.scrollHeight;
            } catch (e) {
              // Ignore partial JSON chunks
            }
          }
        }

        conversationHistory.push({ role: "assistant", content: fullResponse });

      } catch (err) {
        aiMsgDiv.innerHTML = `<span style="color: #f87171;"><strong>Error:</strong> ${err.message}<br><br>If you are on NSW school Wi-Fi and seeing a network/CORS error, <code>://groq.com</code> may be blocked by the school firewall. You can bypass this using a free Cloudflare Worker relay.</span>`;
      } finally {
        sendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
