<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>awa stinks</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body {
      background: linear-gradient(-45deg, #060812, #150b30, #081e36, #1f0a2e);
      background-size: 400% 400%;
      animation: bg 12s ease infinite;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    @keyframes bg { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
    .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .45; pointer-events: none; animation: orb 10s infinite alternate ease-in-out; }
    .o1 { width: 350px; height: 350px; background: #a855f7; top: -80px; left: -80px; }
    .o2 { width: 320px; height: 320px; background: #06b6d4; bottom: -80px; right: -60px; animation-delay: -3s; }
    .o3 { width: 240px; height: 240px; background: #ec4899; top: 40%; left: 45%; animation-delay: -6s; }
    @keyframes orb { to { transform: translate(40px, -35px) scale(1.15); } }
    .top {
      z-index: 2; height: 58px; background: rgba(15,23,42,.75); backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(168,85,247,.4); padding: 0 20px; display: flex; align-items: center; justify-content: space-between;
    }
    .bin {
      background: rgba(255,255,255,.08); border: 1px solid rgba(168,85,247,.4); color: #fff;
      padding: 7px 13px; border-radius: 10px; cursor: pointer; font-size: 1.1rem; transition: .2s;
    }
    .bin:hover { background: #ef4444; transform: scale(1.12) rotate(-8deg); box-shadow: 0 0 16px #ef4444; }
    .title {
      font-weight: 900; font-size: 1.25rem;
      background: linear-gradient(90deg, #06b6d4, #a855f7, #ec4899, #06b6d4);
      background-size: 300% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: shim 4s linear infinite;
    }
    @keyframes shim { to { background-position: 100% 50%; } }
    .chat { z-index: 2; flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; max-width: 900px; width: 100%; margin: 0 auto; }
    .msg { max-width: 82%; padding: 13px 17px; border-radius: 16px; line-height: 1.55; word-wrap: break-word; animation: pop .3s ease forwards; box-shadow: 0 8px 22px rgba(0,0,0,.3); }
    @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: none; } }
    .user { align-self: flex-end; background: linear-gradient(135deg, #4f46e5, #9333ea, #db2777); white-space: pre-wrap; }
    .ai { align-self: flex-start; background: rgba(15,23,42,.78); backdrop-filter: blur(12px); border: 1px solid rgba(168,85,247,.38); }
    .ai pre { background: #050811; padding: 10px; border-radius: 8px; overflow-x: auto; margin: 8px 0; border: 1px solid rgba(6,182,212,.35); }
    .ai code { font-family: monospace; color: #67e8f9; }
    .dots { display: flex; gap: 5px; height: 18px; align-items: center; }
    .dots span { width: 8px; height: 8px; border-radius: 50%; animation: dot 1.2s infinite ease-in-out both; }
    .dots span:nth-child(1) { background: #06b6d4; animation-delay: -.32s; }
    .dots span:nth-child(2) { background: #a855f7; animation-delay: -.16s; }
    .dots span:nth-child(3) { background: #ec4899; }
    @keyframes dot { 0%,80%,100% { transform: scale(.3); opacity: .5; } 40% { transform: scale(1.1); opacity: 1; } }
    .bar { z-index: 2; background: rgba(15,23,42,.78); backdrop-filter: blur(14px); border-top: 1px solid rgba(168,85,247,.4); padding: 14px 20px; }
    .row { max-width: 900px; margin: 0 auto; display: flex; gap: 10px; }
    textarea { flex: 1; resize: none; height: 50px; background: #090d1a; border: 1px solid rgba(168,85,247,.4); color: #fff; padding: 12px 14px; border-radius: 12px; font-size: .96rem; outline: none; }
    textarea:focus { border-color: #06b6d4; box-shadow: 0 0 15px rgba(6,182,212,.45); }
    .send { background: linear-gradient(135deg, #06b6d4, #8b5cf6, #ec4899); color: #fff; border: none; padding: 0 24px; border-radius: 12px; font-weight: 700; cursor: pointer; height: 50px; transition: .2s; }
    .send:hover:not(:disabled) { transform: translateY(-2px) scale(1.04); box-shadow: 0 0 20px rgba(6,182,212,.75); }
    .send:disabled { opacity: .5; }
  </style>
</head>
<body>
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <div class="top">
    <button class="bin" type="button" onclick="clearChat()">🗑️</button>
    <div class="title">awa stinks</div>
    <div style="width:42px"></div>
  </div>
  <div class="chat" id="chat"><div class="msg ai">✅ <strong>Ready!</strong> Type anything and press <strong>Enter</strong>.</div></div>
  <div class="bar">
    <div class="row">
      <textarea id="inp" placeholder="Ask anything... (Enter to send)"></textarea>
      <button class="send" id="btn" type="button" onclick="send()">Send ⚡</button>
    </div>
  </div>
   <script>
    const RELAY_URL = "https://workers.dev";
    const chat = document.getElementById("chat"), inp = document.getElementById("inp"), btn = document.getElementById("btn");
    let hist = [];
    inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
    function clearChat() { hist = []; chat.innerHTML = '<div class="msg ai">Chat cleared!</div>'; }
    function fmt(t) {
      const k = String.fromCharCode(96), kk = k + k + k;
      return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .replace(new RegExp(kk+"(\\w*)\\n([\\s\\S]*?)"+kk,"g"),"<pre><code>$2</code></pre>")
        .replace(new RegExp(k+"([^"+k+"]+)"+k,"g"),"<code>$1</code>")
        .replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>");
    }
    async function send() {
      const txt = inp.value.trim();
      if (!txt || btn.disabled) return;
      inp.value = ""; btn.disabled = true;
      const u = document.createElement("div"); u.className = "msg user"; u.textContent = txt; chat.appendChild(u);
      const a = document.createElement("div"); a.className = "msg ai"; a.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>'; chat.appendChild(a);
      chat.scrollTop = chat.scrollHeight;
      hist.push({ role: "user", content: txt });
      try {
        const res = await fetch(RELAY_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ model: "llama-3.1-8b-instant", messages: [{ role: "system", content: "You are a fast, detailed tutor." }, ...hist], max_tokens: 2048 })
        });
        const raw = await res.text();
        let data;
        try { data = JSON.parse(raw); } catch { throw new Error("HTTP " + res.status + ": " + (raw || "Empty reply")); }
        if (!res.ok) throw new Error(data.error?.message || "HTTP " + res.status);
        const reply = data.choices?.at(0)?.message?.content;
        if (!reply) a.textContent = "⚠️ No reply received.";
        else { a.innerHTML = fmt(reply); hist.push({ role: "assistant", content: reply }); }
      } catch (e) {
        a.innerHTML = '<span style="color:#f87171"><strong>Error:</strong> ' + e.message + '</span>';
      } finally { btn.disabled = false; chat.scrollTop = chat.scrollHeight; inp.focus(); }
    }
  </script>
</body>
</html>
