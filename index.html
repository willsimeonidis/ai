  <script>
    const API_URL="https://workers.dev", KEY="awa_ws_v1", MAX=5;
    const side=document.getElementById("side"), clist=document.getElementById("clist"), scnt=document.getElementById("scnt"), nbtn=document.getElementById("nbtn"), box=document.getElementById("box"), inp=document.getElementById("inp"), sbtn=document.getElementById("sbtn"), pbtn=document.getElementById("pbtn"), mode=document.getElementById("mode"), ccnt=document.getElementById("ccnt");
    let st=JSON.parse(localStorage.getItem(KEY)||"null")||{activeId:"c1",chats:[{id:"c1",title:"Workspace 1",messages:[]}]};
    const save=()=>localStorage.setItem(KEY,JSON.stringify(st));
    const cur=()=>st.chats.find(c=>c.id===st.activeId)||st.chats.at(0);
    const toggleSide=()=>side.classList.toggle("hide");
    function newChat(){ if(st.chats.length>=MAX)return; const id="c"+Date.now(); st.chats.unshift({id,title:"New Chat",messages:[]}); st.activeId=id; save(); render(); }
    function swChat(id){ st.activeId=id; save(); render(); }
    function delChat(e,id){ e.stopPropagation(); st.chats=st.chats.filter(c=>c.id!==id); if(!st.chats.length)st.chats.push({id:"c"+Date.now(),title:"Workspace 1",messages:[]}); if(!st.chats.some(c=>c.id===st.activeId))st.activeId=st.chats.at(0).id; save(); render(); }
    function clearChat(){ const c=cur(); c.messages=[]; c.title="Cleared Chat"; save(); render(); }
    const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    function fmt(t){
      const k=String.fromCharCode(96), kk=k+k+k;
      const parts=esc(t).split(kk);
      return parts.map((p,i)=>{
        if(i%2===1){
          const nl=p.indexOf("\n");
          const code=nl>-1?p.slice(nl+1):p;
          return '<pre><button class="ccode" type="button" onclick="cpCode(this)">Copy</button><code>'+code+'</code></pre>';
        }
        return p.split(k).map((seg,j)=>j%2===1?'<code>'+seg+'</code>':seg.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>")).join("");
      }).join("");
    }
    function cpCode(b){ navigator.clipboard.writeText(b.nextElementSibling.innerText); b.textContent="Copied!"; setTimeout(()=>b.textContent="Copy",1400); }
    function cpMsg(b,i){ const m=cur().messages.at(i); if(!m)return; navigator.clipboard.writeText(m.content); b.textContent="✓ Copied"; setTimeout(()=>b.textContent="Copy",1400); }
    function regen(){ const c=cur(); if(sbtn.disabled||!c.messages.length)return; if(c.messages.at(-1).role==="assistant")c.messages.pop(); const u=c.messages.at(-1); if(u&&u.role==="user"){ c.messages.pop(); inp.value=u.content; send(); } }
    function render(){
      scnt.textContent=st.chats.length+" / "+MAX; nbtn.disabled=st.chats.length>=MAX; clist.innerHTML="";
      st.chats.forEach(c=>{
        const d=document.createElement("div"); d.className="item"+(c.id===st.activeId?" act":""); d.onclick=()=>swChat(c.id);
        d.innerHTML='<span class="ctitle">'+esc(c.title)+'</span><button class="del" type="button">✕</button>';
        d.querySelector(".del").onclick=e=>delChat(e,c.id); clist.appendChild(d);
      });
      const c=cur(); box.innerHTML="";
      if(!c.messages.length){ box.innerHTML='<div class="wrap ai"><div class="msg"><strong>Command Center Ready.</strong> Pick a reply mode above, manage up to 5 saved chats in the sidebar, and press <strong>Enter</strong>.</div></div>'; return; }
      c.messages.forEach((m,i)=>{
        const w=document.createElement("div"); w.className="wrap "+(m.role==="user"?"user":"ai");
        const b=document.createElement("div"); b.className="msg";
        if(m.role==="user"){ b.textContent=m.content; w.appendChild(b); }
        else {
          b.innerHTML=fmt(m.content); w.appendChild(b);
          const a=document.createElement("div"); a.className="acts";
          a.innerHTML='<button class="abtn" type="button" onclick="cpMsg(this,'+i+')">Copy</button>'+(i===c.messages.length-1?'<button class="abtn" type="button" onclick="regen()">↻ Regenerate</button>':'');
          w.appendChild(a);
        }
        box.appendChild(w);
      });
      box.scrollTop=box.scrollHeight;
    }
    function cfg(){
      const m=mode.value;
      if(m==="deep")return{max_tokens:3500,temperature:.55,prompt:"You are an elite, deeply analytical tutor and engineer. Provide an exhaustive, structured, step-by-step breakdown with clear headings, examples, edge cases, and thorough explanations."};
      if(m==="concise")return{max_tokens:800,temperature:.4,prompt:"Be ultra-direct, crisp, and high-signal. Give the exact answer immediately using short bullet points with zero fluff."};
      if(m==="mirror")return{max_tokens:2048,temperature:.75,prompt:"Analyze the user's exact writing style, vocabulary, slang, sentence length, and energy, and mirror that exact tone in your reply while remaining maximally helpful and accurate."};
      return{max_tokens:2048,temperature:.65,prompt:"You are a sharp, clear, and helpful assistant. Give well-structured answers with practical examples."};
    }
    async function polish(){
      const raw=inp.value.trim(); if(!raw||pbtn.disabled||sbtn.disabled)return;
      pbtn.disabled=true; pbtn.textContent="Upgrading...";
      try{
        const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:[{role:"system",content:"Rewrite the user's rough prompt into a crystal-clear, detailed prompt that gets the best possible AI answer. Return ONLY the improved prompt text."},{role:"user",content:raw}],max_tokens:400,temperature:.4})});
        const d=await r.json(); if(d.reply){ inp.value=d.reply.trim(); ccnt.textContent=inp.value.length+" chars • Upgraded"; }
      }catch(e){} finally{ pbtn.disabled=false; pbtn.textContent="✨ Upgrade Prompt"; inp.focus(); }
    }
    async function send(){
      const txt=inp.value.trim(); if(!txt||sbtn.disabled)return;
      const c=cur(); if(!c.messages.length)c.title=txt.slice(0,28)+(txt.length>28?"...":"");
      c.messages.push({role:"user",content:txt}); inp.value=""; ccnt.textContent="0 chars • Saved locally"; sbtn.disabled=true; save(); render();
      const lw=document.createElement("div"); lw.className="wrap ai"; lw.innerHTML='<div class="msg"><div class="pulse"><div class="pdot"></div><span>Generating response...</span></div></div>';
      box.appendChild(lw); box.scrollTop=box.scrollHeight;
      const cf=cfg();
      try{
        const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:[{role:"system",content:cf.prompt},...c.messages],max_tokens:cf.max_tokens,temperature:cf.temperature})});
        const raw=await r.text(); let d;
        try{d=JSON.parse(raw);}catch{throw new Error("HTTP "+r.status+": "+(raw||"Empty reply"));}
        if(!r.ok)throw new Error(d.error?.message||"HTTP "+r.status);
        c.messages.push({role:"assistant",content:d.reply||"No reply returned."});
      }catch(e){ c.messages.push({role:"assistant",content:"**Error:** "+e.message}); }
      finally{ sbtn.disabled=false; save(); render(); inp.focus(); }
    }
    inp.addEventListener("input",()=>{ ccnt.textContent=inp.value.length+" chars • Saved locally"; });
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); } });
    render();
  </script>
</body>
</html>
